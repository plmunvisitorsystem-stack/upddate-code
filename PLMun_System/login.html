<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PLMun - Login Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Poppins', sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #0b1120; background-image: radial-gradient(circle at top right, #1e3a8a 0%, transparent 40%), radial-gradient(circle at bottom left, #0f766e 0%, transparent 40%); }
        .login-card { background: #111827; border: 1px solid #1f2937; border-radius: 20px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); position: relative; overflow: hidden; }
        .login-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, #fbbf24, #f59e0b); }
        .logo-circle { width: 100px; height: 100px; background: #ffffff; border: 3px solid #1e3a8a; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px auto; padding: 5px; box-shadow: 0 0 20px rgba(251, 191, 36, 0.3); overflow: hidden; }
        .logo-img { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; }
        h3 { color: #ffffff; font-weight: 700; font-size: 20px; text-align: center; line-height: 1.3; margin-bottom: 5px; }
        .subtitle { color: #9ca3af; font-size: 14px; text-align: center; margin-bottom: 30px; }
        .form-label { color: #d1d5db; font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 8px;}
        .form-control, .form-select { background: #1f2937; border: 1px solid #374151; color: #ffffff; border-radius: 10px; padding: 12px 15px; font-weight: 400; transition: 0.3s; }
        .form-control:focus, .form-select:focus { background: #1f2937; border-color: #3b82f6; color: #ffffff; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
        .form-control::placeholder { color: #6b7280; }
        .password-wrapper { position: relative; }
        .password-wrapper .form-control { padding-right: 45px; }
        .toggle-password { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #9ca3af; font-size: 18px; transition: 0.2s; }
        .toggle-password:hover { color: #ffffff; }
        .btn-primary-custom { background: #1e3a8a; color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 600; width: 100%; font-size: 16px; transition: 0.3s; display: flex; justify-content: space-between; align-items: center; padding-left: 20px; padding-right: 20px; }
        .btn-primary-custom:hover { background: #1e40af; box-shadow: 0 5px 15px rgba(30, 58, 138, 0.4); }
        .footer-text { color: #6b7280; font-size: 12px; text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid #374151; }
        .forgot-link { color: #fbbf24; font-size: 13px; text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-circle">
        <img src="plmun_logo.png" alt="PLMun Logo" class="logo-img" onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=\'color:#800000; font-weight:bold; font-size:24px;\'>PLMun</span>';">
    </div>
    <h3>Pamantasan ng Lungsod ng<br>Muntinlupa</h3>
    <p style="color: #fbbf24; font-weight: 600; text-align: center; font-size: 15px; margin-bottom: 5px;">Visitor Monitoring System</p>
    <p class="subtitle">Sign in to access your account</p>
    
    <div class="mb-3">
        <label class="form-label">Login As</label>
        <select id="role" class="form-select">
            <option value="" disabled selected>Select Role</option>
            <option value="Student">🎓 Student</option>
            <option value="Faculty">👨‍🏫 Faculty</option>
            <option value="Staff">💼 Staff</option>
            <option value="Visitor">🛂 Visitor</option>
            <option value="Admin">🛡️ Admin</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="Enter your email">
    </div>
    <div class="mb-2">
        <label class="form-label">Password</label>
        <div class="password-wrapper">
            <input type="password" id="password" class="form-control" placeholder="Enter your password">
            <i class="bi bi-eye-slash toggle-password" onclick="togglePassword('password', this)"></i>
        </div>
    </div>
    <div class="text-end mb-4">
        <a href="#" class="forgot-link" onclick="showForgotPassword()">Forgot Password?</a>
    </div>
    <button class="btn-primary-custom" id="loginBtn" onclick="login()">
        <span>Sign In</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8z"/></svg>
    </button>
    <p class="text-center mt-4 mb-0" style="font-size: 13px; color: #9ca3af;">New to the system? <a href="register.html" style="color: #fbbf24; font-weight: 600; text-decoration: none;">Register here</a></p>
    <div class="footer-text">© 2026 Pamantasan ng Lungsod ng Muntinlupa<br>Information and Communications Technology Office</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // BAGONG API KEY
    const firebaseConfig = {
        apiKey: "AIzaSyAvEt5YujwsC5iZGiBUNrCvcsy0IUIztUk",
        authDomain: "plmun-system-v2.firebaseapp.com",
        projectId: "plmun-system-v2",
        storageBucket: "plmun-system-v2.firebasestorage.app",
        messagingSenderId: "348432254532",
        appId: "1:348432254532:web:5b1b138997f77a59ccb1e1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.togglePassword = function(inputId, icon) {
        const input = document.getElementById(inputId);
        if (input.type === "password") { input.type = "text"; icon.classList.remove("bi-eye-slash"); icon.classList.add("bi-eye"); } 
        else { input.type = "password"; icon.classList.remove("bi-eye"); icon.classList.add("bi-eye-slash"); }
    }

    window.login = async function() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const selectedRole = document.getElementById('role').value;
        const btn = document.getElementById('loginBtn');

        if (!selectedRole) return alert('Please select a role.');
        if (!email || !password) return alert('Please enter email and password.');

        btn.innerHTML = 'Authenticating...'; btn.disabled = true;

        try {
            const userCredential = await signInWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;
            const userDoc = await getDoc(doc(db, "users", user.uid));
            
            if (userDoc.exists()) {
                const userData = userDoc.data();
                if (userData.role !== selectedRole) {
                    alert(`Access Denied. You are registered as ${userData.role}.`);
                    btn.innerHTML = 'Sign In'; btn.disabled = false; return;
                }
                localStorage.setItem('currentUser', JSON.stringify({
                    userId: user.uid,
                    fullName: userData.fullName,
                    role: userData.role,
                    email: userData.email,
                    qrString: userData.qrString,
                    profileImage: userData.profileImage || ""
                }));

                if (userData.role === 'Admin' || userData.role === 'Staff') { window.location.href = 'admin_dashboard.html'; } 
                else if (userData.role === 'Student' || userData.role === 'Faculty') { window.location.href = 'student_dashboard.html'; } 
                else if (userData.role === 'Visitor') { window.location.href = 'visitor_dashboard.html'; }
            } else { alert("User data not found in database."); }
        } catch (error) { alert('Login Failed: ' + error.message); } 
        finally { btn.innerHTML = 'Sign In'; btn.disabled = false; }
    }
</script>
</body>
</html>
