<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PLMun - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0b1120; background-image: radial-gradient(circle at top right, #1e3a8a 0%, transparent 40%), radial-gradient(circle at bottom left, #0f766e 0%, transparent 40%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .register-card { background: #111827; border: 1px solid #1f2937; border-radius: 20px; padding: 40px; width: 100%; max-width: 480px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); position: relative; overflow: hidden; }
        .register-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, #fbbf24, #f59e0b); }
        h3 { color: #ffffff; font-weight: 700; }
        .form-label { color: #d1d5db; font-weight: 500; font-size: 14px; }
        .form-control, .form-select { background: #1f2937; border: 1px solid #374151; color: #ffffff; border-radius: 10px; padding: 12px 15px; font-weight: 400; transition: 0.3s; }
        .form-control:focus, .form-select:focus { background: #1f2937; border-color: #3b82f6; color: #ffffff; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
        .form-control::placeholder { color: #6b7280; }
        .password-wrapper { position: relative; }
        .password-wrapper .form-control { padding-right: 45px; }
        .toggle-password { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #9ca3af; font-size: 18px; transition: 0.2s; }
        .toggle-password:hover { color: #ffffff; }
        .btn-primary-custom { background: #1e3a8a; color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 600; width: 100%; font-size: 16px; transition: 0.3s; }
        .btn-primary-custom:hover { background: #1e40af; box-shadow: 0 5px 15px rgba(30, 58, 138, 0.4); }
        #qrResult { display: none; text-align: center; }
        .qr-img { width: 200px; height: 200px; border-radius: 16px; border: 3px solid #3b82f6; margin-bottom: 20px; padding: 10px; background: #fff; box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3); }
        .footer-text { color: #6b7280; font-size: 12px; text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid #374151; }
    </style>
</head>
<body>

<div class="register-card">
    <div id="formArea">
        <h3 class="text-center mb-4">Create Account</h3>
        <div class="mb-3"><label class="form-label">Full Name</label><input type="text" id="fullName" class="form-control" placeholder="Juan Dela Cruz" required></div>
        <div class="mb-3"><label class="form-label">Email Address</label><input type="email" id="email" class="form-control" placeholder="juan@plmun.edu.ph" required></div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <div class="password-wrapper">
                <input type="password" id="password" class="form-control" placeholder="Min. 6 characters" required>
                <i class="bi bi-eye-slash toggle-password" onclick="togglePassword('password', this)"></i>
            </div>
        </div>
        <div class="mb-4"><label class="form-label">Role</label><select id="role" class="form-select"><option value="Student">🎓 Student</option><option value="Faculty">👨‍🏫 Faculty</option><option value="Staff">💼 Staff</option><option value="Visitor">🛂 Visitor</option></select></div>
        <button class="btn-primary-custom mb-3" id="registerBtn" onclick="register()">Create Account</button>
        <p class="text-center mb-0" style="font-size: 14px; color: #9ca3af;">Already have an account? <a href="login.html" style="color: #fbbf24; font-weight: 600; text-decoration: none;">Log in</a></p>
    </div>

    <div id="qrResult">
        <h3 class="mb-2" style="color: #10b981;">Registration Successful! 🎉</h3>
        <p class="mb-4" style="color: #9ca3af; font-size: 14px;">Save your QR code below. You are now logged in.</p>
        <img id="qrImage" src="" alt="QR Code" class="qr-img">
        <h5 id="resultName" class="fw-bold mb-1" style="color: #ffffff;"></h5>
        <p id="resultRole" class="mb-4" style="color: #9ca3af; font-size: 14px;"></p>
        <div class="alert alert-warning border-0 rounded-3 text-start small mb-4" style="background: rgba(251, 191, 36, 0.1); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.2);">
            ⚠️ <strong>Important:</strong> Save this QR code. It serves as your digital ID.
        </div>
        <button class="btn btn-dark w-100 mb-2 py-2 rounded-3" onclick="downloadQR()">📥 Save to Device</button>
        <button class="btn btn-success w-100 py-2 rounded-3 fw-bold" onclick="goToDashboard()">Proceed to My Dashboard →</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // BAGONG API KEY
    const firebaseConfig = {
        apiKey: "AIzaSyAvEt5YujwsC5iZGiBUNrCvcsy0IUIztUk",
        authDomain: "plmun-system-v2.firebaseapp.com",
        projectId: "plmun-system-v2",
        storageBucket: "plmun-system-v2.firebasestorage.app",
        messagingSenderId: "348432254532",
        appId: "1:348432254532:web:5b1b138997f77a59ccb1e1",
        measurementId: "G-GNVN5KHW50"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.togglePassword = function(inputId, icon) {
        const input = document.getElementById(inputId);
        if (input.type === "password") { input.type = "text"; icon.classList.remove("bi-eye-slash"); icon.classList.add("bi-eye"); } 
        else { input.type = "password"; icon.classList.remove("bi-eye"); icon.classList.add("bi-eye-slash"); }
    }

    window.register = async function() {
        const fullName = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const role = document.getElementById('role').value;
        const btn = document.getElementById('registerBtn');

        if (!fullName || !email || !password) return alert('Please fill in all fields.');
        if (password.length < 6) return alert('Password must be at least 6 characters.');

        btn.innerText = 'Processing...'; btn.disabled = true;

        try {
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;
            const qrString = crypto.randomUUID();

            await setDoc(doc(db, "users", user.uid), {
                fullName: fullName,
                email: email,
                role: role,
                qrString: qrString,
                status: "Active",
                profileImage: ""
            });

            window.currentQRString = qrString;
            window.currentName = fullName;
            window.registeredUser = { userId: user.uid, fullName, role, email, qrString };

            document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(qrString)}`;
            document.getElementById('resultName').innerText = fullName;
            document.getElementById('resultRole').innerText = role + ' • ' + email;
            document.getElementById('formArea').style.display = 'none';
            document.getElementById('qrResult').style.display = 'block';

        } catch (error) {
            if (error.code === 'auth/email-already-in-use') {
                alert('⚠️ This email is already registered. Please log in instead.');
            } else { alert('Registration Failed: ' + error.message); }
        } finally { btn.innerText = 'Create Account'; btn.disabled = false; }
    }

    window.downloadQR = function() {
        const link = document.createElement('a');
        link.href = `https://api.qrserver.com/v1/create-qr-code/?size=800x800&data=${encodeURIComponent(window.currentQRString)}`;
        link.download = 'PLMun_QR_' + window.currentName.replace(/\s+/g, '_') + '.png';
        link.click();
    }

    window.goToDashboard = function() {
        if (!window.registeredUser) return alert('Registration data missing.');
        localStorage.setItem('currentUser', JSON.stringify(window.registeredUser));
        if (window.registeredUser.role === 'Admin' || window.registeredUser.role === 'Staff') { window.location.href = 'admin_dashboard.html'; } 
        else if (window.registeredUser.role === 'Student' || window.registeredUser.role === 'Faculty') { window.location.href = 'student_dashboard.html'; } 
        else if (window.registeredUser.role === 'Visitor') { window.location.href = 'visitor_dashboard.html'; }
    }
</script>
</body>
</html>
